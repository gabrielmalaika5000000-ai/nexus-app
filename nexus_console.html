<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0F1A;
    --panel: #131A2B;
    --line: #26314A;
    --text: #E4E9F5;
    --muted: #7C879E;
    --coral: #FF5D5D;
    --amber: #E8A33D;
    --teal: #38D9A9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    background: rgba(11,15,26,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .logo {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700; letter-spacing: 0.08em;
    font-size: 15px;
  }
  .status-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
    background: var(--muted);
  }
  .status-dot.on { background: var(--teal); box-shadow: 0 0 6px var(--teal); }
  .status-dot.off { background: var(--coral); }
  .status-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--muted);
  }

  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 80px; }

  .step {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 4px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .step-head {
    display: flex; align-items: baseline; gap: 10px;
    padding: 14px 16px 0;
  }
  .step-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 6px;
  }
  .step-title {
    font-weight: 600; font-size: 14px;
    letter-spacing: 0.01em;
  }
  .step-body { padding: 12px 16px 16px; }

  label {
    display: block; font-size: 12px; color: var(--muted);
    margin-bottom: 4px; margin-top: 10px;
  }
  label:first-child { margin-top: 0; }

  input[type=text], input[type=password], input[type=datetime-local], select, textarea {
    width: 100%;
    background: #0D1424;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 4px;
    padding: 9px 10px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus, button:focus {
    outline: 2px solid var(--teal); outline-offset: 1px;
  }

  button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; font-weight: 500;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    padding: 9px 14px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary {
    background: var(--teal); border-color: var(--teal); color: #06231b;
    font-weight: 700;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--coral); border-color: var(--coral); background: transparent; }
  button.danger:hover { background: rgba(255,93,93,0.08); }
  button.full { width: 100%; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  .msg { font-size: 12.5px; margin-top: 10px; padding: 8px 10px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; }
  .msg.ok { color: var(--teal); background: rgba(56,209,169,0.08); border: 1px solid rgba(56,209,169,0.25); }
  .msg.err { color: var(--coral); background: rgba(255,93,93,0.08); border: 1px solid rgba(255,93,93,0.25); }
  .msg.hidden { display: none; }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em; color: var(--muted);
    text-transform: uppercase;
    margin: 28px 0 10px;
  }

  .empty {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px; color: var(--muted);
    padding: 16px; text-align: center;
    border: 1px dashed var(--line); border-radius: 4px;
  }

  .action {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 4px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .action-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em;
    padding: 2px 7px; border-radius: 3px;
    text-transform: uppercase;
  }
  .badge.high { background: rgba(255,93,93,0.15); color: var(--coral); }
  .badge.medium { background: rgba(232,163,61,0.15); color: var(--amber); }
  .badge.low { background: rgba(124,135,158,0.15); color: var(--muted); }
  .action-type { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }
  .action-desc { font-size: 14px; line-height: 1.4; margin-bottom: 10px; }

  .ticker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px; color: var(--teal);
    background: #06100c;
    border: 1px solid rgba(56,209,169,0.25);
    border-radius: 3px;
    padding: 8px 10px;
    margin-bottom: 12px;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .ticker .caret {
    display: inline-block; width: 6px; height: 12px;
    background: var(--teal); vertical-align: middle;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .ticker .caret { animation: none; }
  }

  .footer-note {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--muted);
    text-align: center; margin-top: 30px; line-height: 1.6;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">NEXUS</div>
  <div class="status-line"><span class="status-dot" id="connDot"></span><span id="connLabel">non connecté</span></div>
</div>

<main>

  <div class="step">
    <div class="step-head">
      <span class="step-num mono">01</span>
      <span class="step-title">Connexion</span>
    </div>
    <div class="step-body">
      <label for="apiBase">Adresse de ton API</label>
      <input type="text" id="apiBase" value="https://nexus-app-e627.onrender.com" spellcheck="false">

      <label for="apiKey">Clé API</label>
      <div class="row">
        <input type="password" id="apiKey" placeholder="colle ta clé ici" spellcheck="false" style="flex:3">
        <button id="btnCopyKey" type="button" style="flex:1">Copier</button>
      </div>

      <div class="row" style="margin-top:12px">
        <button class="primary" id="btnConnect">Se connecter</button>
        <button id="btnRegister">Créer un compte</button>
      </div>
      <div class="msg hidden" id="connMsg"></div>
    </div>
  </div>

  <div class="step" id="stepIngest" style="display:none">
    <div class="step-head">
      <span class="step-num mono">02</span>
      <span class="step-title">Envoyer un signal</span>
    </div>
    <div class="step-body">
      <label for="sigSource">Source</label>
      <select id="sigSource">
        <option value="email">email</option>
        <option value="messaging">messaging</option>
        <option value="browsing">browsing</option>
        <option value="calendar">calendar</option>
      </select>

      <label for="sigContent">Contenu</label>
      <textarea id="sigContent" placeholder="ex: URGENT réunion demain 14h"></textarea>

      <label for="sigDeadline">Échéance (optionnel)</label>
      <input type="datetime-local" id="sigDeadline">

      <button class="primary full" style="margin-top:12px" id="btnIngest">Envoyer le signal</button>
      <div class="msg hidden" id="ingestMsg"></div>
    </div>
  </div>

  <div class="step" id="stepGmail" style="display:none">
    <div class="step-head">
      <span class="step-num mono">03</span>
      <span class="step-title">Gmail</span>
    </div>
    <div class="step-body">
      <p style="font-size:13px;color:var(--muted);margin:0 0 12px">
        Connecte ta boîte mail pour que NEXUS lise tes emails non lus automatiquement,
        au lieu de les taper à la main ci-dessus.
      </p>
      <button class="primary full" id="btnConnectGmail">Connecter Gmail</button>
      <button class="full" id="btnSyncGmail" style="margin-top:8px">Synchroniser maintenant</button>
      <button class="full" id="btnDebugGmail" style="margin-top:8px">Diagnostic détaillé (lecture seule)</button>
      <div class="msg hidden" id="gmailMsg"></div>
      <div id="debugResults" style="margin-top:12px"></div>
    </div>
  </div>

  <div class="step" id="stepCycle" style="display:none">
    <div class="step-head">
      <span class="step-num mono">04</span>
      <span class="step-title">Analyser les signaux</span>
    </div>
    <div class="step-body">
      <button class="primary full" id="btnCycle">Lancer un cycle de prédiction</button>
      <div class="msg hidden" id="cycleMsg"></div>
    </div>
  </div>

  <div id="dashboardZone" style="display:none">
    <div class="eyebrow">Décisions en attente</div>
    <div id="actionsList"></div>

    <div class="eyebrow">Contexte actuel</div>
    <div class="step">
      <div class="step-body mono" id="contextBox" style="font-size:12px; color:var(--muted); line-height:1.7;"></div>
    </div>
  </div>

  <div class="footer-note">console nexus · les décisions restent entre tes mains</div>
</main>

<script>
(function() {
  "use strict";

  const state = { apiBase: "", apiKey: "" };

  const el = (id) => document.getElementById(id);

  function showMsg(elId, text, ok) {
    const box = el(elId);
    box.textContent = text;
    box.classList.remove("hidden", "ok", "err");
    box.classList.add(ok ? "ok" : "err");
  }

  function setConnected(isConnected, label) {
    el("connDot").className = "status-dot " + (isConnected ? "on" : "off");
    el("connLabel").textContent = label;
    el("stepIngest").style.display = isConnected ? "block" : "none";
    el("stepGmail").style.display = isConnected ? "block" : "none";
    el("stepCycle").style.display = isConnected ? "block" : "none";
    el("dashboardZone").style.display = isConnected ? "block" : "none";
  }

  async function apiCall(path, options) {
    options = options || {};
    const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
    if (state.apiKey) headers["X-API-Key"] = state.apiKey;

    let resp;
    try {
      resp = await fetch(state.apiBase.replace(/\/+$/, "") + path, {
        method: options.method || "GET",
        headers: headers,
        body: options.body ? JSON.stringify(options.body) : undefined
      });
    } catch (e) {
      throw new Error("Impossible de joindre le serveur (vérifie l'adresse et ta connexion).");
    }

    let data = null;
    try { data = await resp.json(); } catch (e) { /* réponse vide ou non-JSON */ }

    if (resp.status === 429) {
      const retryAfter = resp.headers.get("Retry-After");
      throw new Error("Trop de requêtes. Réessaie dans " + (retryAfter || "quelques") + " secondes.");
    }
    if (resp.status === 401) {
      throw new Error((data && data.message) || "Clé API invalide.");
    }
    if (!resp.ok) {
      throw new Error((data && data.message) || ("Erreur serveur (HTTP " + resp.status + ")"));
    }
    return data;
  }

  function priorityClass(p) {
    // Le backend renvoie le nom de l'enum Python en MAJUSCULES
    // (CRITICAL/HIGH/MEDIUM/LOW/MINIMAL) — pas "high"/"haute". Sans ces
    // lignes, CRITICAL et MINIMAL retombaient tous les deux sur le badge gris
    // "low", ce qui masquait exactement l'info que ce badge est censé porter.
    // La palette du design ne définit que 3 accents fonctionnels (corail /
    // ambre / gris) : CRITICAL est mappé sur "high" (au moins aussi visible
    // que HIGH) et MINIMAL sur "low" (au moins aussi discret que LOW),
    // plutôt que d'inventer des couleurs hors palette.
    const v = (p || "").toLowerCase();
    if (v === "critical" || v === "high" || v === "haute") return "high";
    if (v === "medium" || v === "moyenne") return "medium";
    return "low"; // couvre low, minimal, et toute valeur inconnue
  }

  function renderTicker(action) {
    // Le backend sérialise la liste des étapes de raisonnement sous la clé
    // "reasoning" (voir get_dashboard() dans nexus_v2.py), pas
    // "reasoning_chain". Avant ce correctif, ce champ était toujours absent
    // ici, donc le code retombait sur String(action.reasoning) — qui, pour un
    // tableau, produit une seule ligne jointe par des virgules au lieu du
    // ticker ligne-par-ligne voulu.
    const chain = Array.isArray(action.reasoning_chain) ? action.reasoning_chain
                : Array.isArray(action.reasoning) ? action.reasoning
                : null;
    if (chain) return chain.join("\n");
    if (action.reasoning) return String(action.reasoning);
    return "aucune justification détaillée fournie";
  }

  function renderActions(actions) {
    const list = el("actionsList");
    list.innerHTML = "";
    if (!actions || actions.length === 0) {
      list.innerHTML = '<div class="empty">aucune décision en attente — envoie un signal et lance un cycle</div>';
      return;
    }
    actions.forEach(function(a) {
      const card = document.createElement("div");
      card.className = "action";

      const top = document.createElement("div");
      top.className = "action-top";
      const badge = document.createElement("span");
      badge.className = "badge " + priorityClass(a.priority);
      badge.textContent = a.priority || "?";
      const type = document.createElement("span");
      type.className = "action-type";
      type.textContent = a.type || "action";
      top.appendChild(badge);
      top.appendChild(type);

      const desc = document.createElement("div");
      desc.className = "action-desc";
      desc.textContent = a.description || "(pas de description)";

      const ticker = document.createElement("div");
      ticker.className = "ticker";
      ticker.innerHTML = "&gt; " + escapeHtml(renderTicker(a)) + '<span class="caret"></span>';

      const row = document.createElement("div");
      row.className = "row";
      const btnApprove = document.createElement("button");
      btnApprove.className = "primary";
      btnApprove.textContent = "Approuver";
      btnApprove.onclick = function() { handleDecision(a.id, "approve", card); };
      const btnReject = document.createElement("button");
      btnReject.className = "danger";
      btnReject.textContent = "Rejeter";
      btnReject.onclick = function() { handleDecision(a.id, "reject", card); };
      row.appendChild(btnApprove);
      row.appendChild(btnReject);

      card.appendChild(top);
      card.appendChild(desc);
      card.appendChild(ticker);
      card.appendChild(row);
      list.appendChild(card);
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  async function handleDecision(actionId, kind, cardEl) {
    const buttons = cardEl.querySelectorAll("button");
    buttons.forEach(function(b) { b.disabled = true; });
    try {
      await apiCall("/api/v1/actions/" + encodeURIComponent(actionId) + "/" + kind, { method: "POST", body: {} });
      cardEl.style.opacity = "0.4";
      cardEl.querySelector(".action-desc").textContent += kind === "approve" ? "  ✓ approuvée" : "  ✕ rejetée";
    } catch (e) {
      buttons.forEach(function(b) { b.disabled = false; });
      alert(e.message);
    }
  }

  async function refreshDashboard() {
    try {
      const data = await apiCall("/api/v1/dashboard");
      const dash = data.dashboard || {};
      renderActions(dash.pending_actions);
      const ctx = dash.context || {};
      const lines = Object.keys(ctx).map(function(k) { return k + ": " + JSON.stringify(ctx[k]); });
      el("contextBox").textContent = lines.length ? lines.join("\n") : "aucune donnée de contexte pour l'instant";
    } catch (e) {
      el("contextBox").textContent = "erreur de chargement : " + e.message;
    }
  }

  async function connect() {
    state.apiBase = el("apiBase").value.trim();
    state.apiKey = el("apiKey").value.trim();
    if (!state.apiBase || !state.apiKey) {
      showMsg("connMsg", "Renseigne l'adresse et la clé API.", false);
      return;
    }
    el("connMsg").classList.add("hidden");
    try {
      await apiCall("/api/v1/dashboard");
      setConnected(true, "connecté");
      showMsg("connMsg", "Connexion réussie.", true);
      refreshDashboard();
    } catch (e) {
      setConnected(false, "échec");
      showMsg("connMsg", e.message, false);
    }
  }

  async function registerAccount() {
    state.apiBase = el("apiBase").value.trim();
    if (!state.apiBase) {
      showMsg("connMsg", "Renseigne d'abord l'adresse de l'API.", false);
      return;
    }
    const userId = prompt("Choisis un identifiant (ex: ton prénom, sans espace) :");
    if (!userId) return;
    try {
      const data = await apiCall("/api/v1/register", { method: "POST", body: { user_id: userId } });
      el("apiKey").value = data.api_key;
      userIdFromKey = userId;
      showMsg("connMsg", "Compte créé. Clé API remplie automatiquement — clique Se connecter. GARDE CETTE CLÉ, elle ne sera plus jamais affichée.", true);
    } catch (e) {
      showMsg("connMsg", e.message, false);
    }
  }

  async function sendSignal() {
    const source = el("sigSource").value;
    const content = el("sigContent").value.trim();
    if (!content) {
      showMsg("ingestMsg", "Écris un contenu pour le signal.", false);
      return;
    }
    const metadata = {};
    const deadlineVal = el("sigDeadline").value;
    if (deadlineVal) metadata.deadline = new Date(deadlineVal).toISOString();

    try {
      await apiCall("/api/v1/ingest", { method: "POST", body: { source: source, content: content, metadata: metadata } });
      showMsg("ingestMsg", "Signal envoyé.", true);
      el("sigContent").value = "";
      el("sigDeadline").value = "";
    } catch (e) {
      showMsg("ingestMsg", e.message, false);
    }
  }

  async function runCycle() {
    const btn = el("btnCycle");
    btn.disabled = true;
    const originalLabel = btn.textContent;
    btn.textContent = "Cycle en cours…";
    try {
      const data = await apiCall("/api/v1/cycle", { method: "POST", body: {} });
      const r = data.cycle_result || {};
      showMsg("cycleMsg", (r.predictions || 0) + " prédiction(s), " + (r.pending || 0) + " décision(s) en attente.", true);
      refreshDashboard();
    } catch (e) {
      showMsg("cycleMsg", e.message, false);
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  }

  async function copyApiKey() {
    const val = el("apiKey").value;
    if (!val) {
      showMsg("connMsg", "Rien à copier — la clé est vide.", false);
      return;
    }
    try {
      await navigator.clipboard.writeText(val);
      showMsg("connMsg", "Clé copiée dans le presse-papiers.", true);
    } catch (e) {
      // Contexte non sécurisé ou API indisponible : repli sur la méthode
      // historique (fonctionne y compris en ouvrant le fichier en local).
      try {
        const tmp = document.createElement("textarea");
        tmp.value = val;
        tmp.style.position = "fixed";
        tmp.style.opacity = "0";
        document.body.appendChild(tmp);
        tmp.focus();
        tmp.select();
        document.execCommand("copy");
        document.body.removeChild(tmp);
        showMsg("connMsg", "Clé copiée dans le presse-papiers.", true);
      } catch (e2) {
        showMsg("connMsg", "Copie automatique impossible sur ce navigateur — sélectionne le texte manuellement dans le champ.", false);
      }
    }
  }

  el("btnCopyKey").addEventListener("click", copyApiKey);
  el("btnConnect").addEventListener("click", connect);
  el("btnRegister").addEventListener("click", registerAccount);
  el("btnIngest").addEventListener("click", sendSignal);
  function connectGmail() {
    if (!state.apiBase || !state.apiKey) {
      showMsg("gmailMsg", "Connecte-toi d'abord (étape 01).", false);
      return;
    }
    // user_id exact requis par le serveur (le lien doit le porter en clair,
    // impossible de le deviner depuis la clé API seule côté client).
    const uid = prompt("Confirme ton identifiant NEXUS (celui utilisé à la création du compte) :", userIdFromKey || "");
    if (!uid) return;
    const url = state.apiBase.replace(/\/+$/, "") +
      "/api/v1/auth/gmail/start?user_id=" + encodeURIComponent(uid) +
      "&api_key=" + encodeURIComponent(state.apiKey);
    window.location.href = url;
  }

  async function syncGmail() {
    try {
      const data = await apiCall("/api/v1/gmail/sync", { method: "POST", body: {} });
      const m = data.metrics;
      if (data.status === "error" && data.message === "gmail_not_connected") {
        showMsg("gmailMsg", "Gmail pas encore connecté — clique d'abord \"Connecter Gmail\".", false);
        return;
      }
      showMsg("gmailMsg",
        `${m.emails_fetched} emails, ${m.ignored_noise} ignorés, ${m.signals_created} signaux, ` +
        `${m.deadlines_detected} deadline(s) détectée(s), ${m.actions_pending} décision(s) créée(s).`,
        true);
      refreshDashboard();
    } catch (e) {
      showMsg("gmailMsg", e.message, false);
    }
  }

  let userIdFromKey = "";

  el("btnConnectGmail").addEventListener("click", connectGmail);
  function escapeHtmlDebug(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  async function debugGmail() {
    const zone = el("debugResults");
    zone.innerHTML = '<div class="empty">chargement…</div>';
    try {
      const data = await apiCall("/api/v1/gmail/debug?max_results=50");
      if (data.status === "error") {
        showMsg("gmailMsg", data.message === "gmail_not_connected"
          ? "Gmail pas encore connecté." : data.message, false);
        zone.innerHTML = "";
        return;
      }
      showMsg("gmailMsg", `${data.total_fetched} email(s) récupéré(s) (diagnostic, aucune écriture).`, true);

      if (!data.messages.length) {
        zone.innerHTML = '<div class="empty">aucun email non lu récupéré</div>';
        return;
      }

      zone.innerHTML = data.messages.map(function(m) {
        const statusLabel = m.classified_as_noise
          ? '<span class="badge low">BRUIT</span>'
          : (m.deadline_extracted
              ? '<span class="badge high">DEADLINE</span>'
              : '<span class="badge medium">SANS DEADLINE</span>');
        return `<div class="action">
          <div class="action-top">${statusLabel}<span class="action-type">${escapeHtmlDebug(m.gmail_internal_date_readable || "date inconnue")}</span></div>
          <div class="action-desc" style="font-size:12.5px">${escapeHtmlDebug(m.content_preview)}</div>
          ${m.deadline_extracted ? `<div class="ticker">&gt; deadline extraite: ${escapeHtmlDebug(m.deadline_extracted)}</div>` : ""}
        </div>`;
      }).join("");
    } catch (e) {
      showMsg("gmailMsg", e.message, false);
      zone.innerHTML = "";
    }
  }

  el("btnDebugGmail").addEventListener("click", debugGmail);
  el("btnSyncGmail").addEventListener("click", syncGmail);
  el("btnCycle").addEventListener("click", runCycle);

})();
</script>

</body>
</html>
